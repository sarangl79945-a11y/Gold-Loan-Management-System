{% extends "base.html" %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-warning">

        <h3 class="mb-0">

            ✏ Edit Customer

        </h3>

    </div>

    <div class="card-body">

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Customer Name

                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ customer['name'] }}"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Mobile Number

                    </label>

                    <input
                        type="text"
                        name="mobile"
                        class="form-control"
                        value="{{ customer['mobile'] }}"
                        maxlength="10"
                        required>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Address

                </label>

                <textarea
                    name="address"
                    rows="3"
                    class="form-control"
                    required>{{ customer['address'] }}</textarea>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Aadhaar Number

                </label>

                <input
                    type="text"
                    name="aadhaar"
                    class="form-control"
                    value="{{ customer['aadhaar'] }}"
                    maxlength="12"
                    required>

            </div>

            <div class="text-center">

                <button
                    type="submit"
                    class="btn btn-success btn-lg">

                    💾 Update Customer

                </button>

                <a href="{{ url_for('customers') }}"
                   class="btn btn-secondary btn-lg">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
