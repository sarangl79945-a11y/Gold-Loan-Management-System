{% extends "base.html" %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-primary text-white">

        <h3>

            <i class="fa-solid fa-user-plus"></i>

            Add Customer

        </h3>

    </div>

    <div class="card-body">

        <form method="POST"
              enctype="multipart/form-data">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>Name</label>

                    <input type="text"
       name="name"
       class="form-control"
       required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Mobile</label>

                    <input type="text"
       name="mobile"
       class="form-control"
       required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Email</label>

                    <input type="email"
                           name="email"
                           class="form-control">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Date of Birth</label>

                    <input type="date"
                           name="dob"
                           class="form-control">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Gender</label>

                    <select name="gender"
                            class="form-select">

                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>

                    </select>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Occupation</label>

                    <input type="text"
                           name="occupation"
                           class="form-control">

                </div>

                <div class="col-md-12 mb-3">

                    <label>Address</label>

                    <textarea name="address"
                              class="form-control"
                              rows="3"
                              required></textarea>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Aadhaar Number</label>

                    <input type="text"
                           name="aadhaar"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Customer Photo</label>

                    <input type="file"
                           name="photo"
                           class="form-control"
                           accept="image/*">

                </div>

            </div>

            <hr>

            <h5 class="text-primary">

                Nominee Details

            </h5>

            <div class="row">

                <div class="col-md-4 mb-3">

                    <label>Nominee Name</label>

                    <input type="text"
                           name="nominee_name"
                           class="form-control">

                </div>

                <div class="col-md-4 mb-3">

                    <label>Relationship</label>

                    <input type="text"
                           name="nominee_relation"
                           class="form-control">

                </div>

                <div class="col-md-4 mb-3">

                    <label>Nominee Mobile</label>

                    <input type="text"
                           name="nominee_mobile"
                           class="form-control">

                </div>

            </div>

            <div class="mb-3">

                <label>Remarks</label>

                <textarea name="remarks"
                          class="form-control"
                          rows="3"></textarea>

            </div>

            <button class="btn btn-success">

                Save Customer

            </button>

        </form>

    </div>

</div>

{% endblock %}
