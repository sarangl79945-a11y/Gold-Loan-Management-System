<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Gold Loan Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

    <div class="container-fluid">

        <a class="navbar-brand d-flex align-items-center" href="{{ url_for('home') }}">

            <img src="{{ url_for('static', filename='logo.png') }}"
                 width="45"
                 height="45"
                 class="me-2 rounded-circle border border-warning"
                 alt="Logo">

            <div>

                <div class="fw-bold text-warning">
                    GOLD LOAN MANAGEMENT
                </div>

                <small class="text-light">
                    Finance Management Software
                </small>

            </div>

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('home') }}">
                        <i class="fa-solid fa-house"></i>
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('customers') }}">
                        <i class="fa-solid fa-users"></i>
                        Customers
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('add_customer') }}">
                        <i class="fa-solid fa-user-plus"></i>
                        Add Customer
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('loans') }}">
                        <i class="fa-solid fa-building-columns"></i>
                        Loans
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('add_loan') }}">
                        <i class="fa-solid fa-plus"></i>
                        New Loan
                    </a>
                </li>
                <li class="nav-item">
    <a class="nav-link text-danger" href="{{ url_for('logout') }}">
        <i class="fa-solid fa-right-from-bracket"></i>
        Logout
    </a>
</li>

            </ul>

        </div>

    </div>

</nav>

<div class="container-fluid mt-4">

    {% block content %}
    {% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
